<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nexus Anima — основная иконка.
       Без подложки: знак растянут до краёв, поля ~8%.
       Читается и на светлых, и на тёмных обоях. -->
  <defs>
    <linearGradient id="animaCore" gradientUnits="userSpaceOnUse"
                    x1="132" y1="132" x2="380" y2="380">
      <stop offset="0%"   stop-color="#22D3EE"/>
      <stop offset="45%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- орбита -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#A78BFA" stroke-width="28"/>

  <!-- модули: -107.5°, 20°, 133° -->
  <circle cx="196" cy="65"  r="38" fill="#FBBF24"/>
  <circle cx="444" cy="324" r="38" fill="#FBBF24"/>
  <circle cx="120" cy="402" r="38" fill="#FBBF24"/>

  <!-- ядро -->
  <path d="M256 136 Q277 235 376 256 Q277 277 256 376 Q235 277 136 256 Q235 235 256 136 Z"
        fill="url(#animaCore)"/>
</svg>
