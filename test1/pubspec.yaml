name: anima
description: "Nexus Anima — Windows desktop voice assistant with local & remote AI."
publish_to: "none"
version: 3.2.13+123

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  # Direct dep so we can install a portable (next-to-exe) prefs store.
  shared_preferences_platform_interface: ^2.4.2
  speech_to_text: ^7.0.0
  # Lightweight mic amplitude meter for the desktop sidebar visualizer
  # (PCM stream -> RMS). Falls back gracefully if streaming is unavailable.
  record: ^6.0.0
  # Desktop (Windows) integration: window control + system tray + global
  # hotkey + launch-at-startup. Guarded at runtime to Windows.
  window_manager: ^0.4.2
  # Monitor enumeration (already pulled in transitively by window_manager) —
  # used to validate a restored window's geometry against the current display
  # layout so it never lands off-screen.
  screen_retriever: ^0.2.0
  tray_manager: ^0.3.0
  hotkey_manager: ^0.2.3
  # Транзитивная зависимость hotkey_manager, подключённая явно: только из неё
  # берётся PhysicalKeyboardKey.keyCode — virtual-key код Windows, который
  # читает GetAsyncKeyState в PttWatcher (удержание клавиши для Push-to-Talk).
  # Сам hotkey_manager этот геттер наружу не экспортирует, а держать свою
  # таблицу «клавиша → VK» на сотню строк — верный способ забыть половину.
  uni_platform: ^0.1.3
  launch_at_startup: ^0.5.1
  # Win32 system monitor (GlobalMemoryStatusEx / GetSystemTimes) for the
  # CPU/RAM sidebar widget and real RAM detection on Windows.
  ffi: ^2.1.0
  # Per-pixel window transparency on Windows (SetWindowCompositionAttribute) —
  # needed for the floating overlay-widget mode (DesktopIntegration.enterOverlay).
  flutter_acrylic: ^1.1.4
  # Desktop auto-update (Windows = WinSparkle). Replaces Shorebird code-push
  # (mobile-only, Dart-patches-only) — this delivers FULL builds, including
  # native changes (plugins, ffi, the Python sidecar), via an appcast feed.
  auto_updater: ^1.0.0
  # sha256 verification of on-demand downloaded components (sidecar, TTS).
  crypto: ^3.0.0
  uuid: ^4.5.1
  flutter_test:
    sdk: flutter
  file_picker: ^11.0.2
  photo_manager: ^3.9.0
  fllama:
    git:
      url: https://github.com/Telosnex/fllama.git
      ref: 3b1351a957920bf2a0df3709cce1e3a7195c479e
  path_provider: ^2.1.6
  package_info_plus: ^8.1.0
  open_filex: ^4.5.0
  system_info_plus: ^0.0.6
  # QR codes for pairing phones over the local network (remote-input, TZ §14).
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  assets:
    - assets/icon/app_icon.ico
    - assets/icon/icon.png
  uses-material-design: true
  # Фон-аврора стиля «Призма». Собирается только на Impeller; если программа не
  # соберётся, оболочка молча остаётся на размытых пятнах (см. _PrismBackdrop).
  shaders:
    - shaders/prism_aurora.frag
  fonts:
    # Шрифты стиля «Призма». Figtree — интерфейс, JetBrains Mono — числа и
    # горячие клавиши. Оба вариативные: один файл на все веса, как у Nunito.
    # В Figtree нет кириллицы, русский подхватывается из Nunito через
    # fontFamilyFallback в _buildTheme — держать оба семейства обязательно.
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Figtree-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/Figtree-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Figtree-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/Figtree-VariableFont_wght.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
          weight: 800

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  # Мобильных целей у проекта больше нет — папки android/ и ios/ вырезаны.
  # Флаги оставлены выключенными, а не удалены: так видно, что это решение, а
  # не пропуск, и генератор не ищет несуществующие папки.
  android: false
  ios: false
  macos:
    generate: true
  # Windows-иконка НЕ генерируется отсюда. Системные иконки (exe/ярлык/установщик
  # и трей) — отдельный знак, он собирается скриптом assets/icon/gen_system_icons.py
  # из assets/icon/anima_shortcut.ico и assets/icon/anima_tray.svg. Если включить
  # generate обратно, `dart run flutter_launcher_icons` перезапишет
  # windows/runner/resources/app_icon.ico знаком Genesis из icon.png.
  windows:
    generate: false
  web:
    generate: true

# Color-only native splash now: the old static orb image was replaced by the
# in-app animated ImmersiveSplash (the sphere "fly-in"). Native splash is just
# a solid brand-background frame shown during native init, matching the app
# background (_bg) so it blends straight into the animated sphere with no
# visible image swap. Colors track _bg: white (light) / #0E0E15 (dark).
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0E0E15"
  # Осталось от мобильных целей: на iOS true прописывал UIStatusBarHidden в
  # Info.plist и прятал строку состояния во всём приложении, а не только на
  # заставке. Целей больше нет, но и включать флаг незачем — на вебе он ничего
  # полезного не делает.
  fullscreen: false
  android: false
  ios: false
  web: true