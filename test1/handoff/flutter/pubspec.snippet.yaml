# Вставить в pubspec.yaml проекта.

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1        # если не класть .ttf вручную
  shared_preferences: ^2.3.2  # хранение настроек (services/evs_prefs.dart)
  window_manager: ^0.4.2      # плавающий виджет: окно без рамки поверх всех

  # Для настоящего приложения понадобится ещё:
  # tray_manager: ^0.2.4        значок в трее
  # launch_at_startup: ^0.3.0   автозапуск с системой
  # hotkey_manager: ^0.2.3      глобальная горячая клавиша

flutter:
  uses-material-design: true

  # Фрагментный шейдер фона. Путь относительный от корня пакета.
  shaders:
    - shaders/aurora.frag

  # Вариант со своими файлами шрифтов вместо google_fonts:
