# Правила шины событий Nexus Anima.
#
# Порядок важен: побеждает ПЕРВОЕ совпавшее правило, если у него не стоит
# continue. Частные правила держать выше общих, глушилку — последней.
#
# Исходы:
#   DROP  — только в журнал, ничего не происходит;
#   ACT   — выполнить инструмент из белого списка молча;
#   ASK   — спросить и дождаться ответа;
#   RAISE — отдать модели, потому что нужна формулировка или выбор.
#
# ASK и RAISE пока записываются в журнал как недоставленные: канала «вопрос ->
# ответ» между шиной и интерфейсом ещё нет, а модель живёт на стороне
# приложения, не здесь. Правила с ними можно писать уже сейчас — они просто
# будут копиться в журнале, и по нему потом будет видно, что именно ассистент
# порывался сказать и сколько раз.
#
# Инструменты берутся только из белого списка (bus_filter.default_tools).
# Неизвестное имя не выполняется и попадает в журнал как act_failed.

# Игра пошла — приглушить музыку. Обратимое действие, поэтому молча: спрашивать
# про то, что чинится одним словом, значит спрашивать зря.
- id: game-audio-duck
  match:
    type: session.gaming.entered
  action: ACT
  tool: audio.duck_music
  args:
    apps: ["Яндекс Музыка.exe", "Spotify.exe", "chrome.exe", "msedge.exe"]
    level: 20
  say: null

# Игра закончилась — вернуть громкость.
- id: game-audio-restore
  match:
    type: session.gaming.exited
  action: ACT
  tool: audio.unduck_music
  args:
    apps: ["Яндекс Музыка.exe", "Spotify.exe", "chrome.exe", "msedge.exe"]
    level: 100
  say: null

# Видеокарта перегрелась. Порог здесь, а не в источнике: источник сообщает
# факт, решение о том, что 85 градусов — это важно, принимается тут.
- id: gpu-hot
  match:
    type: metrics.gpu.hot
    payload.temp_c: ">= 85"
  action: RAISE
  cooldown_s: 600

# Всё остальное из метрик — шум. Стоит ПОСЛЕ gpu-hot, иначе съело бы и его.
- id: metrics-noise
  match:
    type: metrics.*
  action: DROP
