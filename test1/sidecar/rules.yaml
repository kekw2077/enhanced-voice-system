# Правила шины событий Nexus Anima.
#
# Порядок важен: побеждает ПЕРВОЕ совпавшее правило, если у него не стоит
# continue. Частные правила держать выше общих.
#
# Исходы:
#   DROP  — только в журнал, ничего не происходит;
#   ACT   — выполнить инструмент из белого списка молча;
#   ASK   — спросить вслух и дождаться ответа голосом;
#   RAISE — отдать модели, потому что нужна формулировка или выбор.
#
# RAISE пока записывается в журнал как недоставленный: модель живёт на стороне
# приложения, не здесь. Правила с ним писать можно уже сейчас — они будут
# копить в журнале то, что ассистент порывался сказать.
#
# Списки вида «in:settings.games.switch» приходят из настроек программы
# («События и реакции» → «Игры»). Правило на них ссылается, а называет игры
# человек — здесь их имён нет намеренно: файл описывает ПОВЕДЕНИЕ, а не состав.
#
#   settings.games.list    — все зарегистрированные игры
#   settings.games.switch  — из них те, где звук переключать молча
#   settings.games.ask     — где сначала спросить
#   settings.games.duck    — где приглушать музыку
#   settings.music.app     — чем играет музыка
#   settings.music.duck    — до скольки процентов приглушать
#
# Инструменты берутся только из белого списка (bus_filter.default_tools).
# Неизвестное имя не выполняется и попадает в журнал как act_failed.

# Игра из списка «переключать» запустилась, а звук идёт с колонок. Действие
# обратимое и мгновенное, поэтому молча: спрашивать про то, что чинится одним
# словом, значит спрашивать зря.
#
# Условие про колонки существенно: без него правило переключало бы на наушники
# и тогда, когда звук уже в наушниках, — и каждый запуск игры сопровождался бы
# щелчком переключения устройства без всякой причины.
- id: game-audio-switch
  match:
    type: app.started
    subject.app: "in:settings.games.switch"
    payload.output: speakers
  action: ACT
  tool: audio.to_headphones
  continue: true

# То же самое, но игра из списка «спрашивать». Вопрос звучит вслух — это
# единственный канал, который переживает полноэкранную игру.
- id: game-audio-ask
  match:
    type: app.started
    subject.app: "in:settings.games.ask"
    payload.output: speakers
  action: ASK
  say: Звук идёт с колонок. Переключить на наушники?
  tools: [audio.to_headphones]
  cooldown_s: 300
  continue: true

# Игра закрылась — вернуть звук на колонки. Зеркало правил выше, и условие про
# наушники здесь ровно того же назначения, что там условие про колонки: если за
# время игры человек сам увёл звук куда-то ещё, возвращать нечего и лезть не
# надо. Его выбор важнее нашей симметрии.
#
# Правила два, а не одно, потому что нет общего списка «игры, где мы трогаем
# звук»: в настройках их два — «переключать» и «спрашивать». Возврат в обоих
# случаях молчаливый, и это не оплошность. Спрашивали на входе — «переключить
# ли»; на выходе тот же вопрос звучал бы как второй допрос об уже решённом, а
# отказавшийся тогда сюда просто не попадёт: у него звук и так на колонках.
- id: game-audio-restore
  match:
    type: app.stopped
    subject.app: "in:settings.games.switch"
    payload.output: headphones
  action: ACT
  tool: audio.to_speakers
  continue: true

- id: game-audio-restore-ask
  match:
    type: app.stopped
    subject.app: "in:settings.games.ask"
    payload.output: headphones
  action: ACT
  tool: audio.to_speakers
  continue: true

# Пошла игра, а музыка играет — приглушить. Приложение и уровень берутся из
# настроек, поэтому в правиле их нет: проигрыватель называют один раз.
#
# payload.music — факт от источника: у проигрывателя есть живая звуковая
# сессия. Без этого условия правило «приглушало» бы тишину и писало в журнал
# неудачу там, где просто нечего было приглушать.
- id: music-duck
  match:
    type: app.started
    subject.app: "in:settings.games.duck"
    payload.music: true
  action: ACT
  tool: audio.duck_music

# Игра закрылась — вернуть громкость. Условие про музыку такое же, как у
# приглушения, и по той же причине: если проигрыватель уже закрыт, возвращать
# нечего. Без него журнал писал бы act_failed там, где просто не было работы, —
# а неудача и отсутствие дела должны читаться по-разному.
- id: music-restore
  match:
    type: app.stopped
    subject.app: "in:settings.games.duck"
    payload.music: true
  action: ACT
  tool: audio.unduck_music
